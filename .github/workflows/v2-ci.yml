name: Nexa v2 CI (Rust + Hygiene)

on:
  push:
    branches: ["feat/v2-*", "v2/**", "main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "config/nexa/**"
      - "deploy/nexa/**"
      - "frontend/**"
      - "workers/nexa-ml/**"
      - "tools/nexa-migrate/**"
      - "tests-v2/**"
      - ".github/workflows/v2-ci.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "config/nexa/**"
      - "deploy/nexa/**"
      - "frontend/**"
      - "workers/nexa-ml/**"
      - "tools/nexa-migrate/**"
      - "tests-v2/**"
      - ".github/workflows/v2-ci.yml"

concurrency:
  group: nexa-v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-workspace:
    name: Rust fmt, clippy & nextest (L1/L2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy strict check
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo nextest run --workspace

  config-and-deploy-hygiene:
    name: Config TOML, Deploy Scripts & Audio Fixtures Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify zero hardcoded /home/kza paths in Nexa v2 config & deploy
        run: |
          if grep -rn "/home/kza" config/nexa/ deploy/nexa/systemd/ deploy/nexa/*.sh; then
            echo "ERROR: Found forbidden legacy /home/kza path in Nexa v2 config or deploy files!"
            exit 1
          fi

      - name: Verify zero sudo/world-writable udev rules in deploy/nexa
        run: |
          bash -n deploy/nexa/provision-nexa-user.sh
          bash -n deploy/nexa/install-release.sh
          if grep -n 'MODE="0666"' deploy/nexa/udev/*.rules; then
            echo "ERROR: World-writable 0666 udev rule is forbidden!"
            exit 1
          fi

      - name: Verify synthetic L3 audio fixtures exist and stay compact (<5 MB)
        run: |
          python3 -c "
          import pathlib, wave
          root = pathlib.Path('tests-v2/fixtures/audio')
          wavs = sorted(root.glob('*.wav'))
          assert len(wavs) >= 6, f'Expected >= 6 audio fixtures, found {len(wavs)}'
          total_bytes = sum(p.stat().st_size for p in wavs)
          assert total_bytes < 5 * 1024 * 1024, f'Audio fixtures exceed 5 MB: {total_bytes}'
          for p in wavs:
              with wave.open(str(p), 'rb') as wf:
                  assert wf.getnchannels() == 1 and wf.getframerate() == 16000 and wf.getsampwidth() == 2
          print(f'Verified {len(wavs)} WAV fixtures ({total_bytes / 1024:.1f} KiB total)')
          "

  python-ml-ci:
    name: nexa-ml worker (ruff, stub drift, L2 gRPC sin torch)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/nexa-ml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install worker with dev extra only (no gpu extra, no torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Assert torch and model libraries are not installed
        run: |
          python -c "
          import importlib.util, sys
          heavy = ['torch', 'faster_whisper', 'kokoro', 'speechbrain', 'sentence_transformers']
          found = [m for m in heavy if importlib.util.find_spec(m) is not None]
          sys.exit(f'Heavy ML packages must not be installed in PR CI: {found}' if found else 0)
          "

      - name: Ruff lint & format check
        run: |
          ruff check .
          ruff format --check src tests scripts

      - name: Generated stubs match crates/nexa-proto (drift check)
        run: |
          python scripts/gen_pb.py
          git diff --exit-code -- src/nexa_ml/pb

      - name: L2 tests (real grpc.aio over UDS, model fakes)
        run: python -m pytest -m "not gpu" -q

      - name: GPU extra resolves on CPython 3.13 (uv; resolution only, nothing installed)
        run: |
          python -m pip install uv
          uv pip compile pyproject.toml --extra gpu --python-version 3.13 \
            --python-platform x86_64-unknown-linux-gnu -o /dev/null

  frontend-unit:
    name: Frontend Vite + TypeScript + Svelte 5 (L1/Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm --prefix frontend ci --no-fund --no-audit
      - name: Typecheck (svelte-check + tsc)
        run: npm --prefix frontend run check
      - name: Unit tests (Vitest)
        run: npm --prefix frontend run test
      - name: Production bundle build
        run: npm --prefix frontend run build

  e2e-playwright:
    name: Chromium contra nexa-web real (L4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler
      - name: Build frontend
        run: npm --prefix frontend ci && npm --prefix frontend run build
      - name: Build test server
        run: cargo build --locked -p nexa-web
      - name: Install Playwright and Chromium
        working-directory: tests-v2/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Typecheck E2E specs
        run: npm --prefix tests-v2/e2e run check
      - name: Run browser suite
        run: NEXA_WEB_BIN="$PWD/target/debug/nexa-web" npm --prefix tests-v2/e2e test

  l5-smoke-and-migrate:
    name: Release Packager, L5 Smoke & Offline Migrator (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc & pytest
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler
          python -m pip install --upgrade pip pytest
      - name: Build nexa-memoryd
        run: cargo build --locked -p nexa-memoryd
      - name: Run L5 release/hardening smoke & offline migrator tests
        env:
          NEXA_MEMORYD_BIN: ${{ github.workspace }}/target/debug/nexa-memoryd
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: python -m pytest tests-v2/smoke tools/nexa-migrate/tests -q
