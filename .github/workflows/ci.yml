name: KZA CI/CD

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 07:17 UTC diario, fuera de :00/:30 (evita picos de carga compartida
    # en runners de GitHub). Sin relacion con el cron de entrenamiento real
    # del server (ese vive en systemd del server, no en este workflow);
    # esto solo destraba el job nightly-training-test, que hoy nunca corre
    # porque su `if:` exige schedule/workflow_dispatch y `on:` no declaraba
    # ninguno de los dos (29/29 runs skipped).
    - cron: '17 7 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  # ============================================================
  # LINT AND FORMAT CHECK
  # ============================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: |
          pip install ruff==0.15.1

      - name: Run ruff
        run: ruff check src/ tests/

      - name: Check formatting with ruff format
        # Temporal: el commit de formateo (332 archivos, Task 6) todavia no
        # existe, asi que este sub-chequeo puntual queda en continue-on-error
        # hasta que se aplique. `ruff check` arriba SI bloquea el job.
        continue-on-error: true
        run: ruff format --check src/ tests/

  # ============================================================
  # UNIT TESTS
  # ============================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements-test.txt

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Collect tests
        run: python -m pytest tests/ --collect-only -q

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ============================================================
  # SAFETY TESTS (CRITICAL)
  # ============================================================
  safety-tests:
    name: Safety Tests (CRITICAL)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements-test.txt

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Collect tests
        run: python -m pytest tests/ --collect-only -q

      - name: Run safety tests
        run: |
          pytest tests/safety/ -v --tb=long
        # Safety tests MUST pass - no continue-on-error

  # ============================================================
  # INTEGRATION TESTS
  # ============================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, safety-tests]
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements-test.txt

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Collect tests
        run: python -m pytest tests/ --collect-only -q

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --tb=short

  # ============================================================
  # SECURITY SCAN
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          pip install bandit==1.9.4

      - name: Run bandit security scan
        run: |
          bandit -r src/ -c pyproject.toml -f json -o bandit-report.json || true
          bandit -r src/ -ll -c pyproject.toml  # Fail on medium+ severity (B615 ya no tiene skip global; ver pyproject.toml [tool.bandit] para el pineo/nosec caso a caso)

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

  # ============================================================
  # BUILD CHECK
  # ============================================================
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [unit-tests, safety-tests]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install dependencies
        run: |
          pip install -r requirements-test.txt

      - name: Verify imports work
        run: |
          python -c "from src.pipeline import ModelManager, VoicePipeline"
          python -c "from src.training import NightlyTrainer, NightlyConfig"
          python -c "from src.alerts import AlertManager"
          echo "✅ All imports successful"

      - name: Check configuration
        run: |
          python -c "import yaml; yaml.safe_load(open('config/settings.yaml'))"
          echo "✅ Configuration valid"

  # ============================================================
  # NIGHTLY TRAINING TEST (Scheduled)
  # ============================================================
  nightly-training-test:
    name: Nightly Training Simulation
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Simulate nightly training cycle
        run: |
          python -c "
          import asyncio
          from src.training import NightlyTrainer, NightlyConfig

          async def test_cycle():
              config = NightlyConfig(
                  min_samples_to_train=1,
                  gpus=[0],
                  use_qlora=True
              )
              trainer = NightlyTrainer(config)

              # Test data collection
              examples, stats = trainer.collect_daily_data()
              print(f'Collected {len(examples)} examples')

              # Test status
              status = trainer.get_status()
              print(f'Status: {status}')

              print('✅ Nightly training simulation passed')

          asyncio.run(test_cycle())
          "
