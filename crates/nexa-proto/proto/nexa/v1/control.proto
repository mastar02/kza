syntax = "proto3";

package nexa.v1;

import "nexa/v1/common.proto";
import "nexa/v1/memory.proto";

// Control-plane RPCs exposed by `nexa-brain` over $XDG_RUNTIME_DIR/nexa/brain.sock.
// Consumed by `nexa-web` (Rust Axum) so the web layer never shares an event loop or GIL with voice.
service BrainControlService {
  rpc GetHealth(Empty) returns (HealthResponse);

  // Home Assistant catalog & fail-closed typed actions
  rpc GetHomeCatalog(GetHomeCatalogRequest) returns (HomeCatalogSnapshot);
  rpc ExecuteHomeAction(HomeActionRequest) returns (HomeActionReceipt);
  rpc GetHomeActionReceipt(GetHomeActionReceiptRequest) returns (HomeActionReceipt);

  // LLM endpoints & one-way cloud consent withdrawal
  rpc GetLlmEndpoints(Empty) returns (LlmEndpointsSnapshot);
  rpc ClearLlmCooldown(ClearLlmCooldownRequest) returns (Empty);
  rpc GetCloudConsent(Empty) returns (CloudConsentStatus);
  rpc WithdrawCloudConsent(WithdrawCloudConsentRequest) returns (CloudConsentStatus);

  // Bounded push stream feeding nexa-web WebSocket fan-out (/ws/live, /ws/voices, /ws/evaluation)
  rpc SubscribeLiveEvents(SubscribeLiveEventsRequest) returns (stream LiveRuntimeEvent);

  // Household routines, lists, reminders & alerts (owned by nexa-brain / household.db)
  rpc ListRoutines(ListRoutinesRequest) returns (RoutinesSnapshot);
  rpc GetRoutine(GetRoutineRequest) returns (RoutineRecord);
  rpc GetRoutineRun(GetRoutineRunRequest) returns (RoutineRunRecord);
  rpc ListRoutineRuns(ListRoutineRunsRequest) returns (RoutineRunsSnapshot);
  rpc PreviewRoutine(PreviewRoutineRequest) returns (RoutinePreviewResponse);
  rpc UpsertRoutine(UpsertRoutineRequest) returns (RoutineRecord);
  rpc DeleteRoutine(DeleteRoutineRequest) returns (Empty);
  rpc ExecuteRoutine(ExecuteRoutineRequest) returns (RoutineExecutionReceipt);

  rpc ListHouseholdLists(ActorRequest) returns (HouseholdListsSnapshot);
  rpc MutateHouseholdList(HouseholdListMutationRequest) returns (HouseholdListRecord);
  rpc SyncHouseholdLists(ActorRequest) returns (ListSyncResponse);
  rpc ListReminders(ListRemindersRequest) returns (RemindersSnapshot);
  rpc MutateReminder(ReminderMutationRequest) returns (ReminderRecord);
  rpc ListReminderNotices(ActorRequest) returns (ReminderNoticesResponse);
  rpc GetReminderStatus(ActorRequest) returns (ReminderStatusResponse);

  rpc ListAlerts(ActorRequest) returns (AlertsSnapshot);
  rpc AckAlert(AlertMutationRequest) returns (AlertRecord);
  rpc DeleteAlert(AlertMutationRequest) returns (Empty);
  rpc GetAlertZones(ActorRequest) returns (AlertZonesConfig);
  rpc SetAlertZones(SetAlertZonesRequest) returns (AlertZonesConfig);

  // Observability projections & control-plane proxies (conversations, HA history, memory/voice admin, evaluation)
  rpc ListConversations(ListConversationsRequest) returns (ConversationsSnapshot);
  rpc ListHaActions(ListHaActionsRequest) returns (HaActionsSnapshot);
  rpc ListMemoryOverview(MemoryOverviewRequest) returns (MemoryOverviewResponse);
  rpc MutateMemoryItem(MemoryMutationRequest) returns (MemoryMutationResponse);
  rpc GetVoiceGlobalSwitch(ActorRequest) returns (VoiceGlobalSwitchStatus);
  rpc SetVoiceGlobalSwitch(SetVoiceGlobalSwitchRequest) returns (VoiceGlobalSwitchStatus);
  rpc GetVoiceCaptureReview(VoiceCaptureReviewRequest) returns (VoiceCaptureReviewResponse);
  rpc QueryVoiceCaptures(VoiceCaptureQueryRequest) returns (VoiceCaptureQueryResponse);
  rpc GetEvaluationSample(EvaluationSampleRequest) returns (EvaluationSampleResponse);
}

message GetHomeCatalogRequest {
  ActorContext actor = 1;
}

message HomeEntity {
  string entity_id = 1;
  string domain = 2;
  string room_id = 3;
  string friendly_name = 4;
  string state = 5;
  bool available = 6;
  repeated string capabilities = 7;
  uint64 observed_at_unix_ms = 8;
  optional uint32 brightness_pct = 9;
  optional uint32 color_temp_kelvin = 10;
  optional uint32 color_temp_min = 11;
  optional uint32 color_temp_max = 12;
  optional double temperature = 13;
  optional double current_temperature = 14;
  optional double current_humidity = 15;
  string hvac_action = 16;
  repeated string hvac_modes = 17;
  optional double temperature_min = 18;
  optional double temperature_max = 19;
  optional double temperature_step = 20;
  optional uint32 position = 21;
}

message HomeRoom {
  string room_id = 1;
  string name = 2;
  repeated string entity_ids = 3;
  string default_light = 4;
  string default_climate = 5;
  optional double current_temperature = 6;
  optional double current_humidity = 7;
}

message HomeCatalogSnapshot {
  uint64 observed_at_unix_ms = 1;
  bool stale = 2;
  repeated HomeRoom rooms = 3;
  repeated HomeEntity entities = 4;
}

message HomeActionRequest {
  string request_id = 1;
  string entity_id = 2;
  string operation = 3;
  map<string, string> params = 4;
  ActorContext actor = 5;
}

message HomeActionReceipt {
  string request_id = 1;
  string entity_id = 2;
  string operation = 3;
  string status = 4;
  string detail = 5;
  uint64 completed_at_unix_ms = 6;
}

message GetHomeActionReceiptRequest {
  string request_id = 1;
  ActorContext actor = 2;
}

message LlmEndpointStatus {
  string endpoint_id = 1;
  string kind = 2;
  uint32 priority = 3;
  bool in_cooldown = 4;
  uint64 cooldown_until_unix_ms = 5;
  uint32 consecutive_errors = 6;
}

message LlmEndpointsSnapshot {
  repeated LlmEndpointStatus endpoints = 1;
}

message ClearLlmCooldownRequest {
  string endpoint_id = 1;
  ActorContext actor = 2;
}

message CloudConsentStatus {
  bool consent_granted = 1;
  bool withdrawn_latched = 2;
  uint64 updated_at_unix_ms = 3;
}

message WithdrawCloudConsentRequest {
  ActorContext actor = 1;
}

message SubscribeLiveEventsRequest {
  ActorContext actor = 1;
}

enum LiveEventKind {
  LIVE_EVENT_KIND_UNSPECIFIED = 0;
  LIVE_EVENT_KIND_TURN = 1;
  LIVE_EVENT_KIND_WAKE = 2;
  LIVE_EVENT_KIND_ALERT = 3;
  LIVE_EVENT_KIND_TTS = 4;
  LIVE_EVENT_KIND_COOLDOWN = 5;
  LIVE_EVENT_KIND_HA_STATE = 6;
  LIVE_EVENT_KIND_ERASURE_FENCE = 7;
}

message LiveRuntimeEvent {
  string event_id = 1;
  LiveEventKind kind = 2;
  string room_id = 3;
  string conversation_id = 4;
  string payload_json = 5;
  uint64 emitted_at_unix_ms = 6;
}

message ListRoutinesRequest {
  optional bool enabled_only = 1;
  ActorContext actor = 2;
}

message RoutineRecord {
  string routine_id = 1;
  string name = 2;
  bool enabled = 3;
  uint64 revision = 4;
  string spec_json = 5;
  uint64 updated_at_unix_ms = 6;
  string schedule_json = 7;
}

message RoutinesSnapshot {
  repeated RoutineRecord routines = 1;
}

message GetRoutineRequest {
  string routine_id = 1;
  ActorContext actor = 2;
}

message PreviewRoutineRequest {
  string spec_json = 1;
  ActorContext actor = 2;
}

message RoutinePreviewResponse {
  bool valid = 1;
  string preview_json = 2;
  repeated string errors = 3;
}

message UpsertRoutineRequest {
  string routine_id = 1; // empty on create
  uint64 expected_revision = 2;
  string spec_json = 3;
  ActorContext actor = 4;
}

message DeleteRoutineRequest {
  string routine_id = 1;
  uint64 expected_revision = 2;
  ActorContext actor = 3;
}

message ExecuteRoutineRequest {
  string routine_id = 1;
  string request_id = 2;
  ActorContext actor = 3;
}

message RoutineExecutionReceipt {
  string run_id = 1;
  string routine_id = 2;
  string status = 3;
  uint64 accepted_at_unix_ms = 4;
}

message GetRoutineRunRequest {
  string routine_id = 1;
  string run_id = 2;
  ActorContext actor = 3;
}

message ListRoutineRunsRequest {
  string routine_id = 1;
  uint32 limit = 2; // zero selects the default
  ActorContext actor = 3;
}

message RoutineRunRecord {
  string run_id = 1;
  string routine_id = 2;
  string status = 3; // same vocabulary as RoutineExecutionReceipt
  string source = 4; // manual, scheduled, or voice
  uint64 started_at_unix_ms = 5;
  optional uint64 finished_at_unix_ms = 6;
}

message RoutineRunsSnapshot {
  string routine_id = 1;
  repeated RoutineRunRecord runs = 2;
}

message HouseholdListRecord {
  string list_id = 1;
  string name = 2;
  string owner_user_id = 3; // empty for shared household list
  uint64 revision = 4;
  string items_json = 5;
}

message HouseholdListsSnapshot {
  repeated HouseholdListRecord lists = 1;
}

message HouseholdListMutationRequest {
  string operation = 1; // create_list, rename_list, delete_list, add_item, toggle_item, delete_item
  string list_id = 2;
  uint64 expected_revision = 3;
  string payload_json = 4;
  ActorContext actor = 5;
}

message ListRemindersRequest {
  bool include_personal = 1;
  bool include_completed = 2;
  ActorContext actor = 3;
}

message ReminderRecord {
  string reminder_id = 1;
  string owner_user_id = 2; // empty for shared household reminder
  string title = 3;
  string status = 4;
  uint64 due_at_unix_ms = 5;
  uint64 revision = 6;
  string payload_json = 7;
}

message RemindersSnapshot {
  repeated ReminderRecord reminders = 1;
}

message ReminderMutationRequest {
  string operation = 1; // create, update, cancel, dismiss_notice
  string reminder_id = 2;
  uint64 expected_revision = 3;
  string payload_json = 4;
  ActorContext actor = 5;
}

message AlertRecord {
  string alert_id = 1;
  string kind = 2;
  string severity = 3;
  string status = 4;
  string message = 5;
  uint64 revision = 6;
  bool acknowledged = 7;
  uint64 created_at_unix_ms = 8;
}

message AlertsSnapshot {
  repeated AlertRecord alerts = 1;
}

message AlertMutationRequest {
  string alert_id = 1;
  uint64 expected_revision = 2;
  ActorContext actor = 3;
}

message AlertZonesConfig {
  uint64 revision = 1;
  repeated string zone_ids = 2;
}

message SetAlertZonesRequest {
  uint64 expected_revision = 1;
  repeated string zone_ids = 2;
  ActorContext actor = 3;
}

message ListConversationsRequest {
  uint32 limit = 1;
  string room_id = 2;
  ActorContext actor = 3;
}

message ConversationsSnapshot {
  string payload_json = 1;
}

message ListHaActionsRequest {
  uint32 limit = 1;
  ActorContext actor = 2;
}

message HaActionsSnapshot {
  repeated HomeActionReceipt receipts = 1;
}

message ListSyncResponse {
  string payload_json = 1;
}

message ReminderNoticesResponse {
  string payload_json = 1;
}

message ReminderStatusResponse {
  string payload_json = 1;
}
