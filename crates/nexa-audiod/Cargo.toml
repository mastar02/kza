[package]
name = "nexa-audiod"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
hardware = ["dep:alsa", "dep:rusb", "dep:tokio-serial", "dep:ort"]

[dependencies]
futures-util = { version = "0.3", default-features = false }
nexa-config.workspace = true
nexa-proto.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rtrb = "0.4"
serde.workspace = true
serde_json = "1"
tempfile = "3"
rustix = { version = "1", features = ["fs", "process"] }
uuid = { version = "1", features = ["v4"] }
thiserror.workspace = true
tonic.workspace = true
tokio-stream = { version = "0.1", features = ["sync", "net"] }

[target.'cfg(target_os = "linux")'.dependencies]
alsa = { version = "0.11", optional = true }
rusb = { version = "0.9", optional = true }
tokio-serial = { version = "5", default-features = false, optional = true }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "api-24"], optional = true }

[dev-dependencies]
hound = "3.5"
hyper-util = { version = "0.1", features = ["tokio"] }
proptest.workspace = true
tower = { version = "0.4", features = ["util"] }
